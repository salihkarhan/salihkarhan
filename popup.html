<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مائارىپ ۋە بالىلار پىسخىكىسى</title>
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-glass: rgba(18, 26, 47, 0.75);
      --bg-card: rgba(30, 41, 69, 0.6);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --tag-edu: #34d399;
      --tag-psych: #f472b6;
      --tag-admin: #fbbf24;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 380px;
      min-height: 580px;
      max-height: 600px;
      background: radial-gradient(circle at 10% 20%, #0f172a 0%, #030712 100%);
      color: var(--text-main);
      font-family: 'UKIJ Tuz', 'ALKATIP Basma', 'Uyghur Pashto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-glass) transparent;
      direction: rtl;
    }

    /* Scrollbar */
    body::-webkit-scrollbar {
      width: 5px;
    }
    body::-webkit-scrollbar-thumb {
      background: var(--border-glass);
      border-radius: 4px;
    }

    /* Container */
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .header {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .title-box h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .title-box p {
      font-size: 11px;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Search & Filter Bar */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 8px 36px 8px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: all 0.25s ease;
      direction: rtl;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(15, 23, 42, 0.9);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* Navigation Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #030712;
      box-shadow: 0 2px 8px var(--accent-glow);
      font-weight: bold;
    }

    /* Filter Notice */
    .filter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(52, 211, 153, 0.12);
      color: #34d399;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 6px #34d399;
    }

    /* Article Cards List */
    .articles-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .article-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .article-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .badge-category {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }

    .cat-edu { background: rgba(52, 211, 153, 0.15); color: var(--tag-edu); }
    .cat-psych { background: rgba(244, 114, 182, 0.15); color: var(--tag-psych); }
    .cat-admin { background: rgba(251, 191, 36, 0.15); color: var(--tag-admin); }

    .card-date {
      font-size: 10px;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .card-summary {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      text-align: justify;
      text-justify: inter-word;
      text-indent: 1.5em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .action-btn:hover {
      color: var(--accent);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .action-btn.bookmarked {
      color: #fbbf24;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* Clean Reader Modal (Ad-Free) */
    .reader-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    .reader-modal.active {
      display: flex;
    }

    .reader-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .reader-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .reader-meta {
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .reader-body {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.9;
      text-align: justify;
      text-justify: inter-word;
    }

    .reader-body p {
      text-indent: 2em;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-info">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 13.5l-7-3.82V17l7 3.82 7-3.82v-4.32l-7 3.82z"/></svg>
        </div>
        <div class="title-box">
          <h1>مائارىپ ۋە پىسخىكا</h1>
          <p>ئەڭ يېڭى ئىلغار تەپەككۇر سۇپىسى</p>
        </div>
      </div>
    </header>

    <!-- Search Input -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="ماقالىلەردىن ئىزدەڭ...">
    </div>

    <!-- Category Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-cat="all">ھەممىسى</button>
      <button class="tab-btn" data-cat="edu">مائارىپ</button>
      <button class="tab-btn" data-cat="psych">پىسخىكا</button>
      <button class="tab-btn" data-cat="admin">باشقۇرۇش</button>
    </nav>

    <!-- Meta / 3-Day Notice -->
    <div class="filter-meta">
      <span class="badge-live">
        <span class="pulse-dot"></span>
        ئەڭ يېڭى 3 كۈنلۈك تەۋسىيە
      </span>
      <span id="articleCount">يۈكلىنىۋاتىدۇ...</span>
    </div>

    <!-- Feed List -->
    <main class="articles-feed" id="articlesFeed">
      <!-- Dynamic cards will be rendered here -->
    </main>
  </div>

  <!-- Ad-Free Reader Modal -->
  <div class="reader-modal" id="readerModal">
    <div class="reader-header">
      <span id="modalCategory" class="badge-category cat-edu">مائارىپ</span>
      <button class="close-btn" id="closeReaderBtn">✕</button>
    </div>
    <h2 class="reader-title" id="modalTitle">ماقالە تېمىسى</h2>
    <div class="reader-meta" id="modalMeta">ئاپتورى: نامەلۇم | ۋاقتى: ئەمدىلا</div>
    <div class="reader-body" id="modalBody">
      <!-- Text content inserted here -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
